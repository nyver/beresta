# Beresta home synchronization server example configuration.
# The server runs with safe defaults when this file is absent.
# By default place this file at <data>/config.yaml; --config selects another path.
# Client CRDT/mobile binding, sync batching/backoff, certificate pins, attachment cache retention, SAF backup destinations, automatic lock, WorkManager constraints, secure capture/widget handoff, secure-buffer lifetimes, Argon2id/HKDF/XChaCha20, 4 MiB attachment, encrypted-backup profiles, X25519/Ed25519 identities, SQLCipher keys, Windows DPAPI policy, Android Keystore/biometric policy, Windows tray/global-hotkey/autostart integration, installer/update signing policy, and localization catalogs are local platform contracts and have no server option.

server:
  # Bind to localhost by default. Use an explicit LAN address after reviewing firewall rules.
  listen: "127.0.0.1:8443"
  # The command-line --data value takes precedence over this path.
  data_dir: "./data"
  # Graceful shutdown deadline for in-flight bounded requests.
  shutdown_timeout: "15s"

tls:
  # Supported values: self_signed or files. ACME fields are reserved and enabled mode fails closed.
  mode: "self_signed"
  # File paths are required only when mode is files.
  # Relative paths are resolved from the server process working directory.
  certificate_file: ""
  private_key_file: ""
  acme:
    enabled: false
    hostname: ""
    email: ""
    cache_dir: "./data/acme"

auth:
  # Challenges are single-use and expire quickly.
  challenge_ttl: "5m"
  # Sessions never exceed the required 24-hour lifetime.
  session_ttl: "24h"
  # Owner-generated invite codes expire if they are not consumed.
  invite_ttl: "24h"

limits:
  # Maximum canonical encrypted operation envelope size.
  max_operation_bytes: 1048576
  # Maximum plaintext-equivalent attachment size accepted for one blob.
  max_blob_bytes: 2147483648
  # Per-user server quota: 20 GiB. A restart applies changes to existing users.
  user_quota_bytes: 21474836480
  # Maximum number of operations returned or accepted in one bounded batch.
  max_operations_per_batch: 1000
  # Maximum accepted future Hybrid Logical Clock skew.
  max_hlc_future_skew: "5m"
  # Reject signed envelopes older than this replay/retention window.
  max_hlc_past_age: "8760h"
  # Bounded per-IP and per-device request limiters. WebSocket hints contain no operation bodies.
  requests_per_second: 20
  request_burst: 40

sqlite:
  # These values preserve the reviewed single-writer server behavior.
  busy_timeout: "5s"
  synchronous: "NORMAL"
  wal: true

backups:
  enabled: true
  # The default follows --data; a custom relative path uses the process working directory.
  directory: "./data/backups"
  # How many of the newest valid daily server backups to keep after rotation (1-365).
  keep_daily: 7
  # Local server time in 24-hour HH:MM form.
  daily_at: "02:00"

logging:
  # Supported values: debug, info, warn, error.
  level: "info"
  # JSON is recommended for structured content-free logs.
  format: "json"

metrics:
  # Metrics are optional, aggregate-only, contain no resource labels, and are disabled by default.
  enabled: false
  listen: "127.0.0.1:9090"
