# Beresta home synchronization server example configuration.
# The server runs with safe defaults when this file is absent.
# Client CRDT/mobile binding, secure-buffer lifetimes, Argon2id/HKDF/XChaCha20, 4 MiB attachment, encrypted-backup profiles, X25519/Ed25519 identities, SQLCipher keys, Windows DPAPI/Hello policy, Android Keystore/biometric policy, Windows tray/global-hotkey/autostart integration, desktop cold-start acceptance, installer/update signing policy, the shared client sync-status UI, and localization catalogs are local platform contracts and have no server option.

server:
  # Bind to localhost by default. Use an explicit LAN address after reviewing firewall rules.
  listen: "127.0.0.1:8443"
  # The command-line --data value takes precedence over this path.
  data_dir: "./data"
  # Graceful shutdown deadline for in-flight bounded requests.
  shutdown_timeout: "15s"

tls:
  # Supported values: self_signed or files. ACME support is configured separately when enabled.
  mode: "self_signed"
  # File paths are required only when mode is files.
  certificate_file: ""
  private_key_file: ""
  acme:
    enabled: false
    hostname: ""
    email: ""
    cache_dir: "./data/acme"

auth:
  # Challenges are single-use and expire quickly.
  challenge_ttl: "5m"
  # Sessions never exceed the required 24-hour lifetime.
  session_ttl: "24h"
  # Owner-generated invite codes expire if they are not consumed.
  invite_ttl: "24h"

limits:
  # Maximum canonical encrypted operation envelope size.
  max_operation_bytes: 1048576
  # Maximum plaintext-equivalent attachment size accepted for one blob.
  max_blob_bytes: 2147483648
  # Fixed encrypted attachment chunk size: 4 MiB.
  blob_chunk_bytes: 4194304
  # Per-user server quota: 20 GiB, matching the supported product ceiling.
  user_quota_bytes: 21474836480
  # Maximum number of operations returned or accepted in one bounded batch.
  max_operations_per_batch: 1000
  # Maximum accepted future Hybrid Logical Clock skew.
  max_hlc_future_skew: "5m"
  # Per-device request limiter. WebSocket cursor hints do not contain operation bodies.
  requests_per_second: 20
  request_burst: 40

sqlite:
  # These values preserve the reviewed single-writer server behavior.
  busy_timeout: "5s"
  synchronous: "NORMAL"
  wal: true

backups:
  enabled: true
  directory: "./data/backups"
  # Keep exactly the newest seven valid daily server backups after rotation.
  keep_daily: 7
  # Local server time in 24-hour HH:MM form.
  daily_at: "02:00"

logging:
  # Supported values: debug, info, warn, error.
  level: "info"
  # JSON is recommended for structured content-free logs.
  format: "json"

metrics:
  # Metrics are optional and disabled by default.
  enabled: false
  listen: "127.0.0.1:9090"
