org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Keep Kotlin compilation inside the Gradle process so builds do not depend on
# writable daemon state under the user's local application-data directory.
kotlin.compiler.execution.strategy=in-process
# Kotlin 2.4's Build Tools API fails to close its on-disk incremental caches
# on Windows ("Could not close incremental caches ... class-fq-name-to-source.tab,
# source-to-classes.tab, internal-name-to-source.tab"), which reproducibly breaks
# release builds of third-party plugin modules (e.g. quill_native_bridge_android,
# url_launcher_android). Incremental compilation is what creates those caches, so
# disabling it avoids the crash; release builds recompile from scratch anyway.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
